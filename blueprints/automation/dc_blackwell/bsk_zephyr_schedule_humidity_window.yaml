blueprint:
  name: BSK Zephyr Schedule, Humidity Boost and Window Control
  description: >-
    Controls a BSK Zephyr ventilation unit through its Home Assistant power,
    fan mode and fan speed entities. Runs cycle mode on a daily day/night
    schedule, switches to extract/high after sustained humidity, and optionally
    powers the unit off while any selected window is open. A second humidity
    sensor is used only when the primary sensor is unavailable.
  domain: automation
  author: D. C. Blackwell
  source_url: https://github.com/D-C-Blackwell/home-assistant-bsk-zephyr-blueprint/blob/main/blueprints/automation/dc_blackwell/bsk_zephyr_schedule_humidity_window.yaml
  input:
    power_switch:
      name: BSK power
      selector:
        entity:
          domain: switch
    fan_mode_select:
      name: BSK fan mode
      selector:
        entity:
          domain: select
    fan_speed_select:
      name: BSK fan speed
      selector:
        entity:
          domain: select
    primary_humidity_sensor:
      name: Primary humidity sensor
      description: Room humidity sensor used whenever it is available.
      selector:
        entity:
          domain: sensor
          device_class: humidity
    fallback_humidity_sensor:
      name: Backup humidity sensor
      description: Usually the humidity sensor built into the BSK unit.
      selector:
        entity:
          domain: sensor
          device_class: humidity
    window_sensors:
      name: Window contacts
      description: >-
        Optional. The BSK is powered off while any selected contact is open.
        Leave empty to disable window control.
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true
    night_start:
      name: Night speed starts
      default: "22:00:00"
      selector:
        time:
    day_start:
      name: Day speed starts
      default: "07:00:00"
      selector:
        time:
    boost_humidity:
      name: Extract boost starts at
      default: 60
      selector:
        number:
          min: 30
          max: 90
          step: 1
          unit_of_measurement: "%"
    recovery_humidity:
      name: Extract boost stops at
      description: Set below the boost threshold to provide hysteresis.
      default: 55
      selector:
        number:
          min: 25
          max: 85
          step: 1
          unit_of_measurement: "%"
    boost_delay:
      name: Humidity boost delay
      default:
        hours: 0
        minutes: 5
        seconds: 0
      selector:
        duration:
    recovery_delay:
      name: Humidity recovery delay
      default:
        hours: 0
        minutes: 10
        seconds: 0
      selector:
        duration:

trigger_variables:
  primary_humidity_entity: !input primary_humidity_sensor
  fallback_humidity_entity: !input fallback_humidity_sensor
  boost_level: !input boost_humidity
  recovery_level: !input recovery_humidity

triggers:
  - at: !input night_start
    trigger: time
  - at: !input day_start
    trigger: time
  - minutes: /15
    trigger: time_pattern
  - entity_id: !input window_sensors
    trigger: state
  - entity_id:
      - !input power_switch
      - !input fan_mode_select
      - !input fan_speed_select
    from: unavailable
    trigger: state
  - value_template: >-
      {% set primary = states(primary_humidity_entity) %}
      {% set fallback = states(fallback_humidity_entity) %}
      {% set humidity = primary | float if is_number(primary)
         else fallback | float(-1) %}
      {{ humidity >= boost_level | float }}
    for: !input boost_delay
    trigger: template
  - value_template: >-
      {% set primary = states(primary_humidity_entity) %}
      {% set fallback = states(fallback_humidity_entity) %}
      {% set humidity = primary | float if is_number(primary)
         else fallback | float(-1) %}
      {{ humidity >= 0 and humidity <= recovery_level | float }}
    for: !input recovery_delay
    trigger: template
  - event: start
    trigger: homeassistant

variables:
  primary_humidity_entity: !input primary_humidity_sensor
  fallback_humidity_entity: !input fallback_humidity_sensor
  fan_mode_entity: !input fan_mode_select
  fan_speed_entity: !input fan_speed_select
  selected_windows: !input window_sensors
  boost_level: !input boost_humidity
  recovery_level: !input recovery_humidity
  night_start_value: !input night_start
  day_start_value: !input day_start
  humidity: >-
    {% set primary = states(primary_humidity_entity) %}
    {% set fallback = states(fallback_humidity_entity) %}
    {{ primary | float if is_number(primary) else fallback | float(-1) }}
  scheduled_speed: >-
    {% set current = now().strftime('%H:%M:%S') %}
    {{ 'night' if current >= night_start_value or current < day_start_value else 'low' }}
conditions: []

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ selected_windows | count > 0 and
                 expand(selected_windows)
                 | rejectattr('state', 'eq', 'off')
                 | list | count > 0 }}
        sequence:
          - if:
              - condition: state
                entity_id: !input power_switch
                state: "on"
            then:
              - target:
                  entity_id: !input power_switch
                action: switch.turn_off
      - conditions:
          - condition: template
            value_template: >-
              {{ selected_windows | count == 0 or
                 expand(selected_windows)
                 | rejectattr('state', 'eq', 'off')
                 | list | count == 0 }}
        sequence:
          - if:
              - condition: state
                entity_id: !input power_switch
                state: "off"
            then:
              - target:
                  entity_id: !input power_switch
                action: switch.turn_on
              - delay: "00:00:10"
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ humidity | float(-1) >= boost_level | float or
                         (humidity | float(-1) > recovery_level | float and
                          is_state(fan_mode_entity, 'extract') and
                          is_state(fan_speed_entity, 'high')) }}
                sequence:
                  - if:
                      - condition: template
                        value_template: "{{ not is_state(fan_mode_entity, 'extract') }}"
                    then:
                      - target:
                          entity_id: !input fan_mode_select
                        data:
                          option: extract
                        action: select.select_option
                  - if:
                      - condition: template
                        value_template: "{{ not is_state(fan_speed_entity, 'high') }}"
                    then:
                      - target:
                          entity_id: !input fan_speed_select
                        data:
                          option: high
                        action: select.select_option
            default:
              - if:
                  - condition: template
                    value_template: "{{ not is_state(fan_mode_entity, 'cycle') }}"
                then:
                  - target:
                      entity_id: !input fan_mode_select
                    data:
                      option: cycle
                    action: select.select_option
              - if:
                  - condition: template
                    value_template: "{{ not is_state(fan_speed_entity, scheduled_speed) }}"
                then:
                  - target:
                      entity_id: !input fan_speed_select
                    data:
                      option: "{{ scheduled_speed }}"
                    action: select.select_option

mode: restart
max_exceeded: silent
